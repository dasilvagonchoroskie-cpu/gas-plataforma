name: Preparar plataformas Flutter e builds de teste

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar_plataformas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preparar-plataformas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-e-validar:
    name: Gerar Android, iOS e Web e validar os apps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório sem persistir credenciais
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Flutter do projeto
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Gerar plataformas mantendo o código dos apps
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp -d)"
          apps=(cliente painel_proprietario painel_central)

          for app in "${apps[@]}"; do
            mkdir -p "$backup/$app"
            for item in pubspec.yaml analysis_options.yaml README.md lib test; do
              cp -a "apps/$app/$item" "$backup/$app/"
            done
          done

          flutter create --no-pub --overwrite --platforms=android,ios --org com.example --project-name cliente apps/cliente
          # Android nos painéis é apenas para prévia responsiva; D-006 mantém a decisão móvel em aberto.
          flutter create --no-pub --overwrite --platforms=android,web --org com.example --project-name painel_proprietario apps/painel_proprietario
          flutter create --no-pub --overwrite --platforms=android,web --org com.example --project-name painel_central apps/painel_central

          for app in "${apps[@]}"; do
            for item in pubspec.yaml analysis_options.yaml README.md lib test; do
              rm -rf "apps/$app/$item"
              cp -a "$backup/$app/$item" "apps/$app/"
            done
          done

      - name: Identificar claramente os APKs como prévias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rotulos = {
              'cliente': 'Cliente - previa',
              'painel_proprietario': 'Proprietario - previa',
              'painel_central': 'Central - previa',
          }
          for app, rotulo in rotulos.items():
              manifesto = Path('apps') / app / 'android/app/src/main/AndroidManifest.xml'
              conteudo = manifesto.read_text()
              atualizado, quantidade = re.subn(
                  r'android:label="[^"]+"',
                  f'android:label="{rotulo}"',
                  conteudo,
                  count=1,
              )
              if quantidade != 1:
                  raise SystemExit(f'Não foi possível definir o rótulo de prévia para {app}')
              manifesto.write_text(atualizado)
          PY

      - name: Resolver dependências, formatar, analisar e testar
        shell: bash
        run: |
          set -euo pipefail
          pastas=()
          for raiz in apps packages; do
            if [[ -d "$raiz" ]]; then
              pastas+=("$raiz")
            fi
          done
          mapfile -d '' manifestos < <(find "${pastas[@]}" -type f -name pubspec.yaml -print0 | sort -z)
          for arquivo in "${manifestos[@]}"; do
            pasta="$(dirname "$arquivo")"
            echo "::group::Validando $pasta"
            (
              cd "$pasta"
              flutter pub get
              dart format --output=none --set-exit-if-changed .
              flutter analyze --fatal-infos
              flutter test
            )
            echo '::endgroup::'
          done

      - name: Gerar APKs Android arm64 de depuração para prévia
        shell: bash
        run: |
          set -euo pipefail
          for app in cliente painel_proprietario painel_central; do
            echo "::group::Compilando APK de prévia: $app"
            (cd "apps/$app" && flutter build apk --debug --target-platform android-arm64)
            echo '::endgroup::'
          done

      - name: Gerar builds Web dos painéis
        shell: bash
        run: |
          set -euo pipefail
          for app in painel_proprietario painel_central; do
            (cd "apps/$app" && flutter build web --release)
          done

      - name: Separar APKs e plataformas para prévia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artefato/apps/cliente artefato/apps/painel_proprietario artefato/apps/painel_central
          mkdir -p artefato/build/apks artefato/build/painel_proprietario artefato/build/painel_central
          cp -a apps/cliente/android apps/cliente/ios apps/cliente/.metadata artefato/apps/cliente/
          cp -a apps/painel_proprietario/android apps/painel_proprietario/web apps/painel_proprietario/.metadata artefato/apps/painel_proprietario/
          cp -a apps/painel_central/android apps/painel_central/web apps/painel_central/.metadata artefato/apps/painel_central/
          cp -a apps/cliente/build/app/outputs/flutter-apk/app-debug.apk artefato/build/apks/cliente-debug-arm64.apk
          cp -a apps/painel_proprietario/build/app/outputs/flutter-apk/app-debug.apk artefato/build/apks/painel-proprietario-debug-arm64.apk
          cp -a apps/painel_central/build/app/outputs/flutter-apk/app-debug.apk artefato/build/apks/painel-central-debug-arm64.apk
          cp -a apps/painel_proprietario/build/web artefato/build/painel_proprietario/
          cp -a apps/painel_central/build/web artefato/build/painel_central/
          (cd artefato/build/apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Disponibilizar três APKs de prévia por 7 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: previa-tres-apks-android-arm64
          path: artefato/
          if-no-files-found: error
          retention-days: 7
