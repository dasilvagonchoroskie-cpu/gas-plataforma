name: Disponibilizar APKs de prévia no GitHub privado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar_apks_privadas.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publicar-apks-previa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    name: Verificar artefato e publicar APKs individuais
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar os builds validados da execução de CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: previa-tres-apks-android-arm64
          run-id: 38506208860
          github-token: ${{ github.token }}
          path: download

      - name: Conferir presença e integridade das três APKs
        shell: bash
        run: |
          set -euo pipefail
          cd download/build/apks
          test -s cliente-debug-arm64.apk
          test -s painel-proprietario-debug-arm64.apk
          test -s painel-central-debug-arm64.apk
          sha256sum --check SHA256SUMS.txt

      - name: Criar prévia privada com downloads individuais
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: previa-apks-android-arm64-${{ github.run_id }}
          target_commitish: main
          name: Prévia Android das três interfaces (debug)
          body: |
            Prévia privada de interface para inspeção no celular.

            Contém três APKs Android arm64 de depuração, cada um como arquivo separado, além dos hashes SHA-256.
            Não são builds de produção, não usam identificadores ou assinatura finais e não devem ser distribuídos a clientes.
            Os APKs dos painéis são apenas uma prévia responsiva; a decisão D-006 sobre aplicativo móvel continua pendente.
            Os shells não estão conectados a autenticação, backend ou dados reais.
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            download/build/apks/cliente-debug-arm64.apk
            download/build/apks/painel-proprietario-debug-arm64.apk
            download/build/apks/painel-central-debug-arm64.apk
            download/build/apks/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
