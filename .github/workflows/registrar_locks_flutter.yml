name: Fixar dependências Flutter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registrar_locks_flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registrar-locks-flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolver-e-fixar:
    if: github.ref == 'refs/heads/main'
    name: Resolver, validar e registrar lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Flutter do projeto
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Resolver, analisar e testar cada pacote
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' manifestos < <(find apps packages -type f -name pubspec.yaml -print0 | sort -z)
          for arquivo in "${manifestos[@]}"; do
            pasta="$(dirname "$arquivo")"
            echo "::group::Validando $pasta"
            (
              cd "$pasta"
              flutter pub get
              dart format --output=none --set-exit-if-changed .
              flutter analyze --fatal-infos
              flutter test
            )
            echo '::endgroup::'
          done

      - name: Registrar somente lockfiles dos apps e pacotes privados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/cliente/pubspec.lock \
            apps/painel/pubspec.lock \
            apps/painel_proprietario/pubspec.lock \
            apps/painel_central/pubspec.lock \
            packages/design_system/pubspec.lock \
            packages/nucleo/pubspec.lock
          if git diff --cached --quiet; then
            echo 'Os lockfiles já estão atualizados.'
            exit 0
          fi
          git commit -m 'build: fixa dependências Flutter validadas'
          git push origin HEAD:main
