name: painel
description: Painel do dono e das centrais (web e Android).
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  audioplayers: ^6.1.0
  dados:
    path: ../../packages/dados
  design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.0
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  nucleo:
    path: ../../packages/nucleo
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/som/
