name: cliente
description: Aplicativo do cliente para pedir gás e água.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  dados:
    path: ../../packages/dados
  design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.0
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.0
  go_router: '>=14.8.1 <19.0.0'
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  nucleo:
    path: ../../packages/nucleo
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
